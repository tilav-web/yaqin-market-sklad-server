name: yaqin-market

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: yaqin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yaqin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yaqin_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-yaqin_market}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yaqin} -d ${POSTGRES_DB:-yaqin_market}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yaqin-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Pinned: newer MinIO images require x86-64-v2 CPUs (prod VPS is v1).
    # This release runs everywhere. entrypoint:minio matches its docker-entrypoint.
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: yaqin-minio
    restart: unless-stopped
    entrypoint: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yaqin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-yaqin_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: yaqin-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-yaqin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yaqin_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-yaqin_market}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-yaqin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-yaqin_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-yaqin-uploads}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_in_production_refresh}
      FIXED_OTP_CODE: ${FIXED_OTP_CODE:-111111}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./src:/app/src:ro
      - ./test:/app/test:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./nest-cli.json:/app/nest-cli.json:ro
    command: npm run start:dev

volumes:
  postgres_data:
  redis_data:
  minio_data:
